openapi: 3.0.3
info:
  title: TAMVA API
  version: 1.0.0
  description: |
    Financial identity and trust infrastructure.

    **Authentication.** Cookie session: `POST /api/v1/auth/login/` with
    `{identifier, password}`. Unsafe methods must echo the `csrftoken` cookie in the
    `X-CSRFToken` header.

    **Tenancy.** Institution-scoped endpoints require `X-Institution-ID: <uuid>`;
    the caller must be an active member. Authorization is decided by the backend
    from the caller's roles (see `GET /api/v1/me/`), never by the client.

    **Tracing.** Send `X-Request-ID` (any string up to 128 chars) or one is
    generated. It is echoed on every response and in every error envelope.

    **Idempotency.** Bulk mutations accept `Idempotency-Key`. The same key with the
    same body replays the original response (`Idempotent-Replay: true`); the same key
    with a different body is a `409`.

    **Pagination.** List endpoints return `{count, next, previous, results}` and
    accept `page` and `page_size` (max 100).

    **Filtering and sorting.** Filters are query parameters documented per endpoint.
    Unknown parameters are rejected with `400`, not ignored. `ordering` takes a
    comma-separated allow-listed field list; prefix `-` for descending.

    **Errors.** `{"error": {"code", "message", "request_id", "details"}}`.

    **Rate limits.** Sensitive scopes (auth, credential operations, bulk, export,
    risk evaluation, passport access, security observation) are throttled and
    answer `429` with `Retry-After`. Limits are deployment configuration.

    **Scores.** Financial Confidence is 0-100 (higher = stronger verified financial
    confidence). Risk Score is 0-1000 (higher = higher risk). They are unrelated.
paths:
  /api/v1/analytics/summary/:
    get:
      operationId: api_v1_analytics_summary_retrieve
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Window in days, 1-366 (default 30).
      tags:
      - api
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audit/events/:
    get:
      operationId: api_v1_audit_events_list
      description: |-
        Append-only trail, read-only here. Only events tagged with the active
        institution are visible; platform-level events are not.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Comma-separated sort fields; prefix `-` for descending. Allowed:
          action, created_at, outcome.'
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - FAILURE
          - SUCCESS
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: api_v1_auth_csrf_retrieve
      description: |-
        Hands a CSRF token to clients that cannot read cookies (native apps).

        Session auth requires unsafe requests to echo the token in `X-CSRFToken`.
        Browsers can read the `csrftoken` cookie; React Native cannot, so it asks
        here after sign-in (the token rotates on login) and whenever a request is
        refused. The token is also set as a cookie, so both halves agree. It grants
        nothing by itself: it is only useful together with the session cookie.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorContextEnvelope'
          description: ''
