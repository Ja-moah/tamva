          - $ref: '#/components/schemas/CaseSourceEnum'
          readOnly: true
        current_assignee_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
