  /health/:
    get:
      operationId: health_retrieve
      description: |-
        Kept for backward compatibility with existing external health checks;
        equivalent to ReadinessView. Prefer /health/live/ and /health/ready/.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /health/live/:
    get:
      operationId: health_live_retrieve
      description: |-
        Process is up and can serve requests. No dependency checks: a
        dependency outage must not make the orchestrator restart healthy pods.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          description: ''
  /health/ready/:
    get:
      operationId: health_ready_retrieve
      description: |-
        Required dependencies (PostgreSQL, Redis) are reachable. Optional
        external vendor APIs are deliberately not checked here — a vendor
        outage should not take the whole service out of rotation.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: ''
components:
  schemas:
    AccessPassportShare:
      type: object
      properties:
        token:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionsEnum'
      required:
      - token
    ActionTypeEnum:
      enum:
      - REQUEST_INFORMATION
      - MARK_REVIEWED
      - ESCALATE
      - PLACE_HOLD
      - RELEASE_HOLD
      - RECOMMEND_BLOCK
      - RECOMMEND_ALLOW
      - OTHER
      type: string
      description: |-
        * `REQUEST_INFORMATION` - Request information
        * `MARK_REVIEWED` - Mark reviewed
        * `ESCALATE` - Escalate
        * `PLACE_HOLD` - Place hold
        * `RELEASE_HOLD` - Release hold
        * `RECOMMEND_BLOCK` - Recommend block
        * `RECOMMEND_ALLOW` - Recommend allow
        * `OTHER` - Other
    ActorContext:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ActorUser'
        tenant:
          $ref: '#/components/schemas/ActorTenant'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/ActorMembership'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - memberships
      - permissions
      - roles
      - tenant
      - user
    ActorContextEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ActorContext'
      required:
      - data
    ActorMembership:
      type: object
