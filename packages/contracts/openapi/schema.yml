  /api/v1/cases/:
    get:
      operationId: api_v1_cases_list
      description: Applies the declared filters to `list` (DRF calls `filter_queryset`
        there).
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
          format: uuid
      - in: query
        name: case_type
        schema:
          type: string
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - in: query
        name: customer_id
        schema:
          type: string
          format: uuid
        description: Alias of `customer`.
      - in: query
        name: opened_from
        schema:
          type: string
          format: date-time
      - in: query
        name: opened_to
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Comma-separated sort fields; prefix `-` for descending. Allowed:
          closed_at, opened_at, priority, reference, status.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - LOW
          - MEDIUM
      - in: query
        name: search
        schema:
          type: string
        description: 'Case-insensitive match across: reference, case_type.'
      - in: query
        name: source
        schema:
          type: string
          enum:
          - AUTOMATIC
          - MANUAL
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIONED
          - INVESTIGATING
          - OPEN
          - RESOLVED
          - TRIAGED
      - in: query
        name: unassigned
        schema:
          type: boolean
        description: true = no assignee.
      tags:
      - api
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaseList'
          description: ''
