          description: ''
components:
  schemas:
    AccessPassportShare:
      type: object
      properties:
        token:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/PassportSectionCodeEnum'
      required:
      - token
    ActionTypeEnum:
      enum:
      - REQUEST_INFORMATION
      - MARK_REVIEWED
      - ESCALATE
      - PLACE_HOLD
      - RELEASE_HOLD
      - RECOMMEND_BLOCK
      - RECOMMEND_ALLOW
      - OTHER
      type: string
      description: |-
        * `REQUEST_INFORMATION` - Request information
        * `MARK_REVIEWED` - Mark reviewed
        * `ESCALATE` - Escalate
        * `PLACE_HOLD` - Place hold
        * `RELEASE_HOLD` - Release hold
        * `RECOMMEND_BLOCK` - Recommend block
        * `RECOMMEND_ALLOW` - Recommend allow
        * `OTHER` - Other
    ActiveDisabledStatusEnum:
      enum:
      - ACTIVE
      - DISABLED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `DISABLED` - Disabled
    ActorContext:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ActorUser'
        tenant:
          $ref: '#/components/schemas/ActorTenant'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/ActorMembership'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - memberships
      - permissions
      - roles
      - tenant
      - user
    ActorContextEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ActorContext'
      required:
      - data
    ActorMembership:
      type: object
      properties:
        institution_id:
          type: string
          format: uuid
        institution_name:
          type: string
      required:
      - institution_id
      - institution_name
    ActorTenant:
      type: object
      properties:
        institution_id:
          type: string
          format: uuid
        institution_name:
          type: string
      required:
      - institution_id
      - institution_name
    ActorUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        actor_type:
          type: string
        status:
          type: string
      required:
      - actor_type
      - email
      - id
      - status
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - environments
      - id
      - name
      - slug
      - status
    ApplicationStatusEnum:
      enum:
      - ACTIVE
      - SUSPENDED
      - REVOKED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `SUSPENDED` - Suspended
        * `REVOKED` - Revoked
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/AuditEventOutcomeEnum'
          readOnly: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_id
      - created_at
      - id
      - metadata
      - outcome
    AuditEventOutcomeEnum:
      enum:
      - SUCCESS
      - FAILURE
      type: string
      description: |-
        * `SUCCESS` - Success
        * `FAILURE` - Failure
    BulkAssignCases:
      type: object
      properties:
        case_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          minItems: 1
        assignee_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          default: ''
          maxLength: 2000
      required:
      - case_ids
    BulkRead:
      type: object
      properties:
        notification_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 1
      required:
      - notification_ids
    BulkTriageCases:
      type: object
      properties:
        case_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          minItems: 1
        note:
          type: string
          default: ''
          maxLength: 2000
      required:
      - case_ids
