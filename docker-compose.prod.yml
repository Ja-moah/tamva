services:
  web:
    env_file:
      - .env.production
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_BEHIND_PROXY: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=2)"]
    volumes: !reset []
    restart: unless-stopped
  celery-worker:
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "false"
    volumes: !reset []
    restart: unless-stopped
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
