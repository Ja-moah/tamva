services:
  web:
    env_file:
      - .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DJANGO_DEBUG: "false"
      DJANGO_BEHIND_PROXY: "true"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    volumes: !reset []
    restart: unless-stopped
  celery-worker:
    env_file:
      - .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DJANGO_DEBUG: "false"
    volumes: !reset []
    restart: unless-stopped
  admin:
    restart: unless-stopped
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
