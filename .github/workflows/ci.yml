name: CI

on:
  pull_request:
  push:
    branches: [main, tamva]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tamva_test
          POSTGRES_USER: tamva
          POSTGRES_PASSWORD: tamva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tamva -d tamva_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://tamva:tamva@localhost:5432/tamva_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pip install -r apps/backend/requirements-dev.lock
      - run: pnpm install --frozen-lockfile
      - run: ruff check apps/backend
      - run: ruff format --check apps/backend
      - run: mypy config domains packages
        working-directory: apps/backend
      - run: python apps/backend/manage.py migrate --noinput
      - run: python apps/backend/manage.py check
      - run: pytest
        working-directory: apps/backend
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm --filter @tamva/admin verify:build
      - run: pnpm --filter @tamva/mobile export
